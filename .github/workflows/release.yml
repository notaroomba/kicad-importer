name: release

on:
  push:
    tags: ["v*"]
    # bumping the version in metadata.json on main also releases it (tags can be pushed too)
    branches: [main]
    paths: [metadata.json, .github/workflows/release.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"
          else tag="v$(python3 -c 'import json; print(json.load(open("metadata.json"))["versions"][0]["version"])')"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi

      - name: Build PCM package
        if: ${{ !steps.tag.outputs.exists }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          tag = os.environ["TAG"]
          version = tag.lstrip("v")
          files = [p for d in ("plugins", "resources") for p in sorted(Path(d).rglob("*"))
                   if p.is_file() and "__pycache__" not in p.parts]
          meta = json.loads(Path("metadata.json").read_text())
          ver = meta["versions"][0]
          ver["version"] = version
          ver["install_size"] = sum(p.stat().st_size for p in files)

          Path("dist").mkdir(exist_ok=True)
          zip_name = f"kicad-importer-{version}.zip"
          zip_path = Path("dist") / zip_name
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p, p.as_posix())
              z.writestr("metadata.json", json.dumps(meta, indent=2))

          data = zip_path.read_bytes()
          ver["download_sha256"] = hashlib.sha256(data).hexdigest()
          ver["download_size"] = len(data)
          ver["download_url"] = f"https://github.com/{os.environ['REPO']}/releases/download/{tag}/{zip_name}"
          Path("dist/metadata.json").write_text(json.dumps(meta, indent=2))

          # PCM repository: add .../releases/latest/download/repository.json in KiCad
          base = f"https://github.com/{os.environ['REPO']}/releases/download/{tag}/"
          now = datetime.now(timezone.utc)
          stamp = dict(update_timestamp=int(now.timestamp()), update_time_utc=now.strftime("%Y-%m-%d %H:%M:%S"))
          Path("dist/packages.json").write_text(json.dumps({"packages": [meta]}, indent=2))
          with zipfile.ZipFile("dist/resources.zip", "w") as z:
              z.write("resources/icon.png", meta["identifier"] + "/icon.png")
          repo = {"$schema": meta["$schema"], "name": "notaroomba's KiCad plugins", "maintainer": meta["author"]}
          for key, name in (("packages", "packages.json"), ("resources", "resources.zip")):
              repo[key] = dict(url=base + name, sha256=hashlib.sha256(Path("dist", name).read_bytes()).hexdigest(), **stamp)
          Path("dist/repository.json").write_text(json.dumps(repo, indent=2))
          print(json.dumps(repo, indent=2))
          PY

      - name: Create release
        if: ${{ !steps.tag.outputs.exists }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "$TAG" dist/*.zip dist/*.json --target "$GITHUB_SHA" --title "$TAG" --generate-notes
